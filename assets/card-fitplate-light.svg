<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 250" width="490" height="250" role="img" aria-label="FitPlate: Snap a meal photo and a vision model (Gemini or Claude) estimates its nutrition. One Zod schema types the UI and the model's output.">
<defs><linearGradient id="gc" x1="0" x2="1">
      <stop offset="0" stop-color="#f6f8fa" stop-opacity="0"/>
      <stop offset=".5" stop-color="#f6f8fa" stop-opacity=".9"/>
      <stop offset="1" stop-color="#f6f8fa" stop-opacity="0"/></linearGradient></defs>
<style>
  .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}
  .t{fill:#1f2328} .m{fill:#59636e} .a{fill:#1f9d6b}
  .sk{fill:#e8ebef}
  @keyframes shimmer{0%{transform:translateX(-300px)}100%{transform:translateX(1300px)}}
  .shine{animation:shimmer 1.6s linear infinite}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes fadeOut{to{opacity:0}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important} .reveal{opacity:1!important} .skel-phase{opacity:0}}
 text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{50%{opacity:.35}}
  @keyframes ring{0%,10%{stroke-dashoffset:var(--c)}55%,90%{stroke-dashoffset:var(--o)}100%{stroke-dashoffset:var(--c)}}
  @keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  @keyframes cycle3{0%,30%{opacity:1}33%,97%{opacity:0}100%{opacity:1}}
</style>
<rect x=".5" y=".5" width="489" height="249" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="24" y="44" class="mono a" font-size="11.5" letter-spacing="1">AI · NUTRITION DASHBOARD</text>
<text x="24" y="76" class="t" font-size="23" font-weight="700" letter-spacing="-.4">FitPlate</text>
<text x="24" y="110" class="m" font-size="13.5">Snap a meal photo and a vision model (Gemini</text><text x="24" y="131" class="m" font-size="13.5">or Claude) estimates its nutrition. One Zod</text><text x="24" y="152" class="m" font-size="13.5">schema types the UI and the model's output.</text><rect x="24" y="206" width="86" height="24" rx="12" fill="none" stroke="#d0d7de"/><text x="67" y="222" text-anchor="middle" class="m" font-size="11.5">Next.js 16</text><rect x="118.0" y="206" width="36" height="24" rx="12" fill="none" stroke="#d0d7de"/><text x="136" y="222" text-anchor="middle" class="m" font-size="11.5">Zod</text><rect x="161.6" y="206" width="72" height="24" rx="12" fill="none" stroke="#d0d7de"/><text x="197" y="222" text-anchor="middle" class="m" font-size="11.5">LLM APIs</text><rect x="241.2" y="206" width="36" height="24" rx="12" fill="none" stroke="#d0d7de"/><text x="259" y="222" text-anchor="middle" class="m" font-size="11.5">RTL</text>
<g><circle cx="420" cy="92" r="34" fill="none" stroke="#e8ebef" stroke-width="9"/>
<circle cx="420" cy="92" r="34" fill="none" stroke="#1f9d6b" stroke-width="9" stroke-linecap="round" stroke-dasharray="213.6" transform="rotate(-90 420 92)" style="--c:213.6;--o:59.8;stroke-dashoffset:213.6;animation:ring 5s ease-in-out infinite"/>
<circle cx="420" cy="46" r="5" fill="#0969da"><animateTransform attributeName="transform" type="rotate" from="0 420 92" to="360 420 92" dur="6s" repeatCount="indefinite"/></circle><circle cx="420" cy="46" r="5" fill="#bf7a00"><animateTransform attributeName="transform" type="rotate" from="0 420 92" to="360 420 92" dur="9s" repeatCount="indefinite"/></circle><text x="420" y="97" text-anchor="middle" class="t" font-size="13" font-weight="700">kcal</text></g>
<text x="466" y="44" text-anchor="end" class="m" font-size="18">↗</text>
</svg>