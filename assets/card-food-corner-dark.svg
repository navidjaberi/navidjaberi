<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 250" width="490" height="250" role="img" aria-label="Food Corner: Customer and admin roles enforced with Row Level Security, server-side order pricing, CI running lint, tests and build.">
<defs><linearGradient id="gc" x1="0" x2="1">
      <stop offset="0" stop-color="#30363d" stop-opacity="0"/>
      <stop offset=".5" stop-color="#30363d" stop-opacity=".9"/>
      <stop offset="1" stop-color="#30363d" stop-opacity="0"/></linearGradient></defs>
<style>
  .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}
  .t{fill:#e6edf3} .m{fill:#8b949e} .a{fill:#42b883}
  .sk{fill:#21262d}
  @keyframes shimmer{0%{transform:translateX(-300px)}100%{transform:translateX(1300px)}}
  .shine{animation:shimmer 1.6s linear infinite}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes fadeOut{to{opacity:0}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important} .reveal{opacity:1!important} .skel-phase{opacity:0}}
 text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{50%{opacity:.35}}
  @keyframes ring{0%,10%{stroke-dashoffset:var(--c)}55%,90%{stroke-dashoffset:var(--o)}100%{stroke-dashoffset:var(--c)}}
  @keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  @keyframes cycle3{0%,30%{opacity:1}33%,97%{opacity:0}100%{opacity:1}}
</style>
