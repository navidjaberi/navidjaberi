<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 250" width="490" height="250" role="img" aria-label="Golfam: an advertising agency's WordPress site, rebuilt solo as a full-stack Nuxt 4 app. PostgreSQL makes double booking of its 150+ billboards impossible.">
<defs><linearGradient id="gc" x1="0" x2="1">
      <stop offset="0" stop-color="#30363d" stop-opacity="0"/>
      <stop offset=".5" stop-color="#30363d" stop-opacity=".9"/>
      <stop offset="1" stop-color="#30363d" stop-opacity="0"/></linearGradient></defs>
<style>
  .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}
  .t{fill:#e6edf3} .m{fill:#8b949e} .a{fill:#42b883}
  .sk{fill:#21262d}
  @keyframes shimmer{0%{transform:translateX(-300px)}100%{transform:translateX(1300px)}}
  .shine{animation:shimmer 1.6s linear infinite}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes fadeOut{to{opacity:0}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important} .reveal{opacity:1!important} .skel-phase{opacity:0}}
 text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{50%{opacity:.35}}
  @keyframes ring{0%,10%{stroke-dashoffset:var(--c)}55%,90%{stroke-dashoffset:var(--o)}100%{stroke-dashoffset:var(--c)}}
  @keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  @keyframes cycle3{0%,30%{opacity:1}33%,97%{opacity:0}100%{opacity:1}}
</style>
<rect x=".5" y=".5" width="489" height="249" rx="16" fill="#161b22" stroke="#30363d"/>
<text x="24" y="44" class="mono a" font-size="11.5" letter-spacing="1">FULL-STACK · CLIENT WORK</text>
<text x="24" y="76" class="t" font-size="23" font-weight="700" letter-spacing="-.4">Golfam</text>
<text x="24" y="110" class="m" font-size="13.5">An ad agency's WordPress site, rebuilt solo</text><text x="24" y="131" class="m" font-size="13.5">as a full-stack Nuxt 4 app. PostgreSQL makes</text><text x="24" y="152" class="m" font-size="13.5">double booking of 150+ billboards impossible.</text><rect x="24" y="206" width="64" height="24" rx="12" fill="none" stroke="#30363d"/><text x="56" y="222" text-anchor="middle" class="m" font-size="11.5">Nuxt 4</text><rect x="96" y="206" width="90" height="24" rx="12" fill="none" stroke="#30363d"/><text x="141" y="222" text-anchor="middle" class="m" font-size="11.5">PostgreSQL</text><rect x="194" y="206" width="64" height="24" rx="12" fill="none" stroke="#30363d"/><text x="226" y="222" text-anchor="middle" class="m" font-size="11.5">Docker</text><rect x="266" y="206" width="90" height="24" rx="12" fill="none" stroke="#30363d"/><text x="311" y="222" text-anchor="middle" class="m" font-size="11.5">360+ tests</text>
<style>@keyframes book{0%,15%{opacity:0}22%,100%{opacity:1}}
@keyframes clash{0%,48%{opacity:0}52%,60%{opacity:1}64%,68%{opacity:.2}72%,88%{opacity:1}94%,100%{opacity:0}}
@keyframes ok{0%,15%{opacity:0}22%,46%{opacity:1}50%,100%{opacity:0}}
.bk{opacity:0;animation:book 6s infinite} .cl{opacity:0;animation:clash 6s infinite} .okl{opacity:0;animation:ok 6s infinite}
@media (prefers-reduced-motion:reduce){.bk{opacity:1} .okl{opacity:1}}</style>
<g><rect x="340" y="54" width="20" height="14" rx="4" fill="#f5a524" fill-opacity=".35"/><rect x="364" y="54" width="20" height="14" rx="4" fill="#f5a524" fill-opacity=".35"/><rect x="388" y="54" width="20" height="14" rx="4" fill="#21262d"/><rect x="412" y="54" width="20" height="14" rx="4" fill="#21262d"/><rect x="436" y="54" width="20" height="14" rx="4" fill="#21262d"/><rect x="340" y="72" width="20" height="14" rx="4" fill="#21262d"/><rect x="364" y="72" width="20" height="14" rx="4" fill="#21262d"/><rect x="388" y="72" width="20" height="14" rx="4" fill="#21262d"/><rect x="412" y="72" width="20" height="14" rx="4" fill="#f5a524" fill-opacity=".35"/><rect x="436" y="72" width="20" height="14" rx="4" fill="#f5a524" fill-opacity=".35"/><rect x="340" y="90" width="20" height="14" rx="4" fill="#f5a524" fill-opacity=".35"/><rect x="364" y="90" width="20" height="14" rx="4" fill="#21262d"/><rect x="388" y="90" width="20" height="14" rx="4" fill="#f5a524" fill-opacity=".35"/><rect x="412" y="90" width="20" height="14" rx="4" fill="#f5a524" fill-opacity=".35"/><rect x="436" y="90" width="20" height="14" rx="4" fill="#21262d"/>
<rect class="bk" x="388" y="72" width="20" height="14" rx="4" fill="#f5a524"/>
<rect class="cl" x="386" y="70" width="24" height="18" rx="6" fill="none" stroke="#f85149" stroke-width="2"/>
<text x="400" y="124" text-anchor="middle" class="mono okl" font-size="10.5" fill="#f5a524">slot booked ✓</text>
<text x="400" y="124" text-anchor="middle" class="mono cl" font-size="10.5" fill="#f85149">double booking ✕</text></g>
<text x="466" y="44" text-anchor="end" class="m" font-size="18">↗</text>
</svg>
