<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 250" width="490" height="250" role="img" aria-label="Personal Website: My portfolio in English, Persian and Turkish, with full RTL support, dark and light themes and motion with Framer Motion.">
<defs><linearGradient id="gc" x1="0" x2="1">
      <stop offset="0" stop-color="#f6f8fa" stop-opacity="0"/>
      <stop offset=".5" stop-color="#f6f8fa" stop-opacity=".9"/>
      <stop offset="1" stop-color="#f6f8fa" stop-opacity="0"/></linearGradient></defs>
<style>
  .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}
  .t{fill:#1f2328} .m{fill:#59636e} .a{fill:#1f9d6b}
  .sk{fill:#e8ebef}
  @keyframes shimmer{0%{transform:translateX(-300px)}100%{transform:translateX(1300px)}}
  .shine{animation:shimmer 1.6s linear infinite}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes fadeOut{to{opacity:0}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important} .reveal{opacity:1!important} .skel-phase{opacity:0}}
 text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{50%{opacity:.35}}
  @keyframes ring{0%,10%{stroke-dashoffset:var(--c)}55%,90%{stroke-dashoffset:var(--o)}100%{stroke-dashoffset:var(--c)}}
  @keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  @keyframes cycle3{0%,30%{opacity:1}33%,97%{opacity:0}100%{opacity:1}}
</style>
<rect x=".5" y=".5" width="489" height="249" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="24" y="44" class="mono a" font-size="11.5" letter-spacing="1">PORTFOLIO · I18N</text>
<text x="24" y="76" class="t" font-size="23" font-weight="700" letter-spacing="-.4">Personal Website</text>
<text x="24" y="110" class="m" font-size="13.5">My portfolio in English, Persian and Turkish,</text><text x="24" y="131" class="m" font-size="13.5">with full RTL support, dark and light themes</text><text x="24" y="152" class="m" font-size="13.5">and motion with Framer Motion.</text><rect x="24" y="206" width="64" height="24" rx="12" fill="none" stroke="#d0d7de"/><text x="56" y="222" text-anchor="middle" class="m" font-size="11.5">Next.js</text><rect x="96.4" y="206" width="79" height="24" rx="12" fill="none" stroke="#d0d7de"/><text x="136" y="222" text-anchor="middle" class="m" font-size="11.5">next-intl</text><rect x="183.2" y="206" width="72" height="24" rx="12" fill="none" stroke="#d0d7de"/><text x="219" y="222" text-anchor="middle" class="m" font-size="11.5">Tailwind</text>
<g><rect x="340" y="54" width="120" height="40" rx="10" fill="#ffffff" stroke="#d0d7de"/><text x="400" y="81" text-anchor="middle" font-size="20" font-weight="700" class="a" style="opacity:0;animation:cycle3 6s infinite 0s" direction="ltr">Hello</text><text x="400" y="81" text-anchor="middle" font-size="20" font-weight="700" class="a" style="opacity:0;animation:cycle3 6s infinite 2s" direction="rtl">سلام</text><text x="400" y="81" text-anchor="middle" font-size="20" font-weight="700" class="a" style="opacity:0;animation:cycle3 6s infinite 4s" direction="ltr">Merhaba</text>
<text x="400" y="112" text-anchor="middle" class="mono m" font-size="11">EN · FA · TR</text></g>
