<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 244" width="1000" height="244" role="img" aria-label="Experience timeline: Golfam 2026-present, Dongi 2025-2026, Qman 2024-2026">
<style>
  .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}
  .t{fill:#e6edf3} .m{fill:#8b949e} .a{fill:#42b883}
  .sk{fill:#21262d}
  @keyframes shimmer{0%{transform:translateX(-300px)}100%{transform:translateX(1300px)}}
  .shine{animation:shimmer 1.6s linear infinite}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes fadeOut{to{opacity:0}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important} .reveal{opacity:1!important} .skel-phase{opacity:0}}
 text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}
  @keyframes grow{to{width:var(--w)}} .grow{animation:grow 1.1s cubic-bezier(.3,.7,.2,1) forwards}
  .reveal{opacity:0;animation:fadeIn .5s ease forwards}
  .inbar{fill:#fff;font-weight:600}
  @media (prefers-reduced-motion:reduce){.grow{width:var(--w)}}</style>
<rect x=".5" y=".5" width="999" height="243" rx="16" fill="#161b22" stroke="#30363d"/>
<text x="24" y="30" class="m mono" font-size="12">// recent experience</text>
<line x1="200.0" y1="36" x2="200.0" y2="216" stroke="#30363d" stroke-dasharray="3 5"/><text x="200.0" y="236" text-anchor="middle" class="m mono" font-size="12">2024</text>
<line x1="460.0" y1="36" x2="460.0" y2="216" stroke="#30363d" stroke-dasharray="3 5"/><text x="460.0" y="236" text-anchor="middle" class="m mono" font-size="12">2025</text>
<line x1="720.0" y1="36" x2="720.0" y2="216" stroke="#30363d" stroke-dasharray="3 5"/><text x="720.0" y="236" text-anchor="middle" class="m mono" font-size="12">2026</text>
<g>
  <text x="24" y="75" class="t" font-size="15" font-weight="600">Golfam</text>
  <text x="24" y="93" class="m" font-size="11.5">Freelance · Full-stack · Solo</text>
  <rect x="893.3" y="61" width="45.5" height="20" rx="10" fill="#f5a524" fill-opacity=".15"/>
  <rect x="893.3" y="61" height="20" rx="10" fill="#f5a524" class="grow" style="--w:45.5px;animation-delay:0.20s" width="0"/>
  <circle cx="938.8" cy="71" r="4" fill="#f5a524"><animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/></circle>
  <text x="883.3" y="75" text-anchor="end" class="m reveal" style="animation-delay:1.00s" font-size="12">Nuxt 4 + PostgreSQL rebuild · 89 API routes · 360+ tests</text></g>
<g>
  <text x="24" y="129" class="t" font-size="15" font-weight="600">Dongi</text>
  <text x="24" y="147" class="m" font-size="11.5">Full-time · Remote · Scrum</text>
  <rect x="676.7" y="115" width="130.0" height="20" rx="10" fill="#42b883" fill-opacity=".15"/>
  <rect x="676.7" y="115" height="20" rx="10" fill="#42b883" class="grow" style="--w:130.0px;animation-delay:0.35s" width="0"/>
  <text x="666.7" y="129" text-anchor="end" class="m reveal" style="animation-delay:1.15s" font-size="12">Nuxt CRM for 50+ staff · SEO 100</text></g>
<g>
  <text x="24" y="183" class="t" font-size="15" font-weight="600">Qman</text>
  <text x="24" y="201" class="m" font-size="11.5">Part-time · Hybrid · Lead</text>
  <rect x="330.0" y="169" width="498.3" height="20" rx="10" fill="#35a0ff" fill-opacity=".15"/>
  <rect x="330.0" y="169" height="20" rx="10" fill="#35a0ff" class="grow" style="--w:498.3px;animation-delay:0.50s" width="0"/>
  <text x="344.0" y="183" text-anchor="start" class="inbar reveal" style="animation-delay:1.30s" font-size="12">Led 3 Nuxt apps · menu editor PWA</text></g>
</svg>