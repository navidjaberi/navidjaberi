<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 90" width="1000" height="90" role="img" aria-label="Thanks for stopping by">
<style>
  .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}
  .t{fill:#e6edf3} .m{fill:#8b949e} .a{fill:#42b883}
  .sk{fill:#21262d}
  @keyframes shimmer{0%{transform:translateX(-300px)}100%{transform:translateX(1300px)}}
  .shine{animation:shimmer 1.6s linear infinite}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes fadeOut{to{opacity:0}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important} .reveal{opacity:1!important} .skel-phase{opacity:0}}
 text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}
  @keyframes fill{0%{width:0}70%,100%{width:920px}}
  @keyframes late{0%,70%{opacity:0}80%,100%{opacity:1}} @keyframes early{0%,65%{opacity:1}75%,100%{opacity:0}}</style>
<rect x="40" y="30" width="920" height="6" rx="3" class="sk"/>
<rect x="40" y="30" height="6" rx="3" fill="#42b883" width="0" style="animation:fill 3.5s ease-out forwards"/>
<text x="40" y="66" class="m" font-size="13" style="animation:early 3.5s forwards">loading the rest of this profile…</text>
<text x="40" y="66" class="a" font-size="13" opacity="0" style="animation:late 3.5s forwards">✓ loaded. thanks for stopping by.</text>
</svg>