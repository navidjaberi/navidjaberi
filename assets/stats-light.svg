<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 130" width="1000" height="130" role="img" aria-label="4+ years of Vue and Nuxt; 360+ tests on a full-stack Nuxt app; server response cut from 2.25 s to 25 ms; 50+ daily users on a CRM">
<style>
  .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}
  .t{fill:#1f2328} .m{fill:#59636e} .a{fill:#1f9d6b}
  .sk{fill:#e8ebef}
  @keyframes shimmer{0%{transform:translateX(-300px)}100%{transform:translateX(1300px)}}
  .shine{animation:shimmer 1.6s linear infinite}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes fadeOut{to{opacity:0}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important} .reveal{opacity:1!important} .skel-phase{opacity:0}}
 .tile{opacity:0;animation:fadeIn .6s ease forwards} text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}</style><g class="tile" style="animation-delay:0.00s">
