  <text x="20.0" y="78" font-size="40" font-weight="700" fill="#1f9d6b" letter-spacing="-1">4+</text>
  <text x="20.0" y="106" font-size="14" class="m">years of Vue &amp; Nuxt</text></g><g class="tile" style="animation-delay:0.15s">
  <rect x="254.5" y=".5" width="237.0" height="129" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
